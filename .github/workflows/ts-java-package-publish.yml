name: Publish Java Package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Hibernate 7.2 enforces a JDK 25 floor through its own jdks-settings plugin
      # (the 6.6 fork used JDK 11, and JDK 21 fails the build before it resolves a
      # single dependency). The published artifact still targets the release level
      # the build sets, so consumers on Java 21 are unaffected.
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "zulu"

      - name: Publish package
        run: |
          ./gradlew hibernate-core:clean
          ./gradlew hibernate-core:publishPublishedArtifactsPublicationToGitHubPackagesRepository \
            -Pgithub.user=${{ github.actor }} \
            -Pgithub.token=${{ secrets.GITHUB_TOKEN }} \
            --no-build-cache
