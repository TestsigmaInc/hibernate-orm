name: Publish Java Package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Hibernate 7 needs JDK 17 or newer to build; the 6.6 fork used JDK 11.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Publish package
        run: |
          ./gradlew hibernate-core:clean
          ./gradlew hibernate-core:publishPublishedArtifactsPublicationToGitHubPackagesRepository \
            -Pgithub.user=${{ github.actor }} \
            -Pgithub.token=${{ secrets.GITHUB_TOKEN }} \
            --no-build-cache
